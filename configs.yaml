defaults:

  seed: 0
  method: name
  task: dummy_disc
  logdir: ./sumo_fpi_log/
  replay: uniform
  replay_size: 1e6
  replay_online: False
  # Sample high-risk sequences more often when replay: danger is selected.
  danger_replay: {sample_ratio: 0.6, cost_threshold: 0.20}  # danger replay采样配置：sample_ratio为危险序列采样比例，cost_threshold为判定危险序列的cost阈值
  # Bootstrap first, then freeze the policy, sweep all scenarios, and enter
  # rare-scenario post-training with a KL constraint to the frozen policy.
  danger_posttrain:
    enabled: False  # 是否启用bootstrap之后的危险场景post-train流程
    bootstrap_episodes: 5000  # 第一轮正常训练的episode数；达到后冻结策略并开始全场景评估
    evaluate_all_scenarios: True  # post-train开始前是否对所有sumocfg场景sweep评估一遍
    freeze_danger_library_after_sweep:  True # 仅冻结旧危险库更新/旧事件日志；独立episode采集由collect_episodes控制
    reference_kl_target: 1.0  # 第二轮策略相对冻结参考策略的KL目标
    reference_kl_lam_init: 1.0  # KL约束拉格朗日系数初始值
    reference_kl_lam_lr: 1e-4  # KL约束系数更新学习率
    reference_kl_lam_max: 20.0  # KL约束系数上限
  eval_dir: ''
  filter: '(^|/)(model_loss|policy_loss|critic_loss)$'
  #fpi
  critic_type: dual_q
  use_dual_policy: True
  use_risk_model: False
  use_recovery_model: False

  dual_actor_opt: {opt: adam, lr: 3e-5, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0, lateclip: 0.0}
  risk_critic_opt: {opt: adam, lr: 3e-5, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0, lateclip: 0.0}
  reward_critic_opt: {opt: adam, lr: 3e-5, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0, lateclip: 0.0}

  risk_head: {layers: 3, units: 512, act: silu, norm: layer, dist: binary, outscale: 0.0, outnorm: False, inputs: [deter, stoch], winit: normal, fan: avg, symlog_inputs: False}

  jax:
    platform: gpu
    jit: True
    precision: float16
    prealloc: False
    debug_nans: False
    logical_cpus: 0
    logical_gpus: 1
    debug: False
    policy_devices: [0]
    train_devices: [0]
    metrics_every: 10

  run:
    script: train
    steps: 1e10
    expl_until: 8000
    log_every: 300
    save_every: 900
    eval_every: 1e6
    eval_initial: True
    eval_eps: 1
    eval_samples: 1
    train_ratio: 32.0
    train_fill: 0
    eval_fill: 0
    log_zeros: False
    log_keys_video: [image, image2]
    log_keys_sum: '^$'
    log_keys_mean: 'log_entropy|log_plan_action_mean|log_plan_action_std|log_plan_num_safe_traj|log_plan_ret|log_plan_cost|log_plan_penalty|log_plan_lagrange_multiplier|log_plan_penalty_multiplier|log_lagrange_penalty|log_lagrange_p|log_lagrange_i|log_lagrange_d|log_main_risk|log_risk_threshold|log_use_dual'
    log_keys_max: 'log_entropy|log_plan_action_mean|log_plan_action_std|log_plan_num_safe_traj|log_plan_ret|log_plan_cost|log_plan_penalty|log_plan_lagrange_multiplier|log_plan_penalty_multiplier|log_lagrange_penalty|log_lagrange_p|log_lagrange_i|log_lagrange_d|log_main_risk|log_risk_threshold|log_use_dual'
    from_checkpoint: ''
    sync_every: 10
    # actor_addr: 'tcp://127.0.0.1:5551'
    actor_addr: 'ipc:///tmp/5551'
    actor_batch: 32

  envs: {amount: 1, parallel: process, length: 0, reset: True, restart: True, discretize: 0, checks: False}
  wrapper: {length: 0, reset: True, discretize: 0, checks: False}
  env:
    atari: {size: [64, 64], repeat: 4, sticky: True, gray: False, actions: all, lives: unused, noops: 0, resize: opencv}
    dmlab: {size: [64, 64], repeat: 4, episodic: True}
    minecraft: {size: [64, 64], break_speed: 100.0}
    dmc: {size: [64, 64], repeat: 2, camera: -1}
    loconav: {size: [64, 64], repeat: 2, camera: -1}
    metadrive: {size: [64,64], repeat: 4, render: False, obs_key: 'image'}
    carracing: {size: [64,64], repeat: 2, render: False, obs_key: 'image'}
    safetygym: {size: [64,64], repeat: 1, render: False, obs_key: 'observation', camera_name: 'fixedfar'}
    safetygymcoor: {size: [64,64], repeat: 5, render: False, obs_key: 'observation', camera_name: 'fixedfar'}
    safetygymmujoco: {size: [64,64], repeat: 1, render: False, obs_key: 'observation'}
    gym: {repeat: 1, render: True, obs_key: 'observation'}
    sumo:
      repeat: 1
      render: False
      obs_key: observation
      danger:
        enabled: False  # 是否启用SUMO危险场景挖掘/生成器
        generation_enabled: True  # 是否允许从危险库采样并生成scenario_copy或intent_attack变体
        collect_episodes: False  # 独立轨迹池默认关闭；sumo_long_tail_data overlay显式启用
        update_library: True  # 是否在线更新旧危险库；冻结后训练会覆盖为False
        warmup_episodes: 20  # 危险库至少积累/导入多少episode后才允许生成变体
        library_size: 200  # 内存中保留的最高severity危险原型数量
        generate_probability: 0.35  # 每次reset时尝试生成危险变体的概率
        generation_mode: mixed  # copy/attack/replay/mixed/off：控制第二轮危险场景生成类型
        replay_probability: 0.333333  # 危险变体中直接回放背景车的概率
        intent_attack_probability: 0.50  # 非回放危险变体中选择intent_attack而非scenario_copy的概率
        near_miss_ttc: 2.5  # 最小TTC低于该阈值时记为near_miss
        risk_cost_threshold: 0.10  # max_cost高于该阈值时记为high_risk_cost
        min_initial_distance: 5.0  # 生成变体前要求初始最近车辆距离至少大于该值
        copy_speed_jitter: 1.0  # 兼容旧配置；当前scenario_copy不再做速度扰动
        attack_speed_delta: 2.0  # intent_attack中目标车相对ego加速的最大幅度
        max_target_speed: 12.0  # 生成变体时目标车速度上限
        intent_attack_wait_steps: 30  # intent_attack初始无背景车时，最多等待多少个SUMO步让cfg车流出现
        intent_attack_replay_bootstrap: False  # intent_attack初始无背景车时不走replay兜底，只重试下一个危险样本
        intent_attack_bootstrap_frames: 8  # intent_attack最多尝试多少个replay帧来恢复背景车
        max_replay_steps: 400  # 每个危险原型最多保存多少步回放轨迹
        replay_pre_margin: 3  # 生成变体时从关键危险帧前多少步恢复
        max_replay_seek_steps: 400  # 恢复回放轨迹时最多快进多少个SUMO step
        replay_frame_search: 8  # 关键帧附近额外尝试的回放帧数量
        replay_insert_missing: True  # 回放恢复时尝试补回当前SUMO中不存在的车辆
        replay_insert_during_playback: False  # 回放开始后不再补插新车，避免TraCI连接被SUMO关闭
        replay_ego: False  # 回放时只回放旁车；Auto自车仍由当前策略从起点正常控制
        require_valid_replay_state: False  # 测试回放：回放恢复后不因近距离/碰撞 gate 直接回退
        fallback_to_normal_on_danger_failure: False  # 危险变体失败时不回退普通场景，改为重试或报错
        max_danger_generation_attempts: 8  # 单次reset最多重试多少个危险原型
        highlight_danger_target: True  # 第二轮生成intent_attack时高亮被扰动背景车
        danger_target_color: [255, 255, 0, 255]  # 被扰动背景车颜色，默认黄色RGBA
        highlight_replay_vehicles: True  # 第二轮replay时高亮回放背景车
        replay_vehicle_color: [0, 0, 255, 255]  # 回放背景车颜色，默认蓝色RGBA
        replay_progress_interval: 0  # 回放推进时每隔多少帧打印一次进度；0表示关闭
        replay_debug_interval: 0  # 回放诊断：每隔多少帧打印细节；0表示关闭
        max_episode_steps: 2500  # 兜底：单个episode最多允许的环境step数；0表示关闭
        seed: 0  # 危险场景采样随机种子
  # Agent
  task_behavior: Greedy
  expl_behavior: None
  batch_size: 16
  batch_length: 64
  data_loaders: 8

 # World Model
  grad_heads: [decoder, reward, cont, cost]
  rssm: {deter: 4096, units: 1024, stoch: 32, classes: 32, act: silu, norm: layer, initial: learned, unimix: 0.01, unroll: False, action_clip: 1.0, winit: normal, fan: avg}
  encoder: {mlp_keys: '.*', cnn_keys: '.*', act: silu, norm: layer, mlp_layers: 5, mlp_units: 1024, cnn: resnet, cnn_depth: 96, cnn_blocks: 0, resize: stride, winit: normal, fan: avg, symlog_inputs: True, minres: 4}
  decoder: {mlp_keys: '.*', cnn_keys: '.*', act: silu, norm: layer, mlp_layers: 5, mlp_units: 1024, cnn: resnet, cnn_depth: 96, cnn_blocks: 0, image_dist: mse, vector_dist: mse, inputs: [deter, stoch], resize: stride, winit: normal, fan: avg, outscale: 1.0, minres: 4, cnn_sigmoid: False}
  reward_head: {layers: 5, units: 1024, act: silu, norm: layer, dist: symlog_disc, outscale: 0.0, outnorm: False, inputs: [deter, stoch], winit: normal, fan: avg, bins: 255}
  cost_head: {layers: 5, units: 1024, act: silu, norm: layer, dist: symlog_disc, outscale: 1.0, outnorm: False, inputs: [deter, stoch], winit: normal, fan: avg, bins: 255}
  cont_head: {layers: 5, units: 1024, act: silu, norm: layer, dist: binary, outscale: 1.0, outnorm: False, inputs: [deter, stoch], winit: normal, fan: avg}
  loss_scales: {image: 1.0, vector: 1.0, reward: 1.0, cost: 1.0, cont: 1.0, dyn: 0.5, rep: 0.1, actor: 1.0, critic: 1.0, slowreg: 1.0}
  dyn_loss: {impl: kl, free: 1.0}
  rep_loss: {impl: kl, free: 1.0}
  model_opt: {opt: adam, lr: 1e-4, eps: 1e-8, clip: 1000.0, wd: 0.0, warmup: 0, lateclip: 0.0}

  # Actor Critic
  actor: {layers: 5, units: 1024, act: silu, norm: layer, minstd: 0.1, maxstd: 1.0, outscale: 1.0, outnorm: False, unimix: 0.01, inputs: [deter, stoch], winit: normal, fan: avg, symlog_inputs: False}
  critic: {layers: 5, units: 1024, act: silu, norm: layer, dist: symlog_disc, outscale: 0.0, outnorm: False, inputs: [deter, stoch], winit: normal, fan: avg, bins: 255, symlog_inputs: False}
  qcritic: {layers: 5, units: 1024, act: silu, norm: layer, dist: symlog_disc, outscale: 0.0, outnorm: False, inputs: [tensor], winit: normal, fan: avg, bins: 255, symlog_inputs: False}
  actor_opt: {opt: adam, lr: 3e-5, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0, lateclip: 0.0}
  critic_opt: {opt: adam, lr: 3e-5, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0, lateclip: 0.0}
  cost_critic_opt: {opt: adam, lr: 3e-5, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0, lateclip: 0.0}

  actor_dist_disc: onehot
  actor_dist_cont: trunc_normal                                #trunc_normal   normal 
  actor_grad_disc: reinforce
  actor_grad_cont: backprop
  # critic_type: Qfunction    #现在还有Qfunction    vfunction
  imag_horizon: 15
  imag_unroll: False
  horizon: 333
  penalty_multiplier_init: 5e-9
  lagrange_multiplier_init: 1e-6
  use_cost: True
  pessimistic: False
  cost_weight: 10.0
  cost_limit: 25.0
  use_cost_model: True
  return_lambda: 0.95
  critic_slowreg: logprob
  slow_critic_update: 1
  slow_critic_fraction: 0.02
  retnorm: {impl: perc_ema, decay: 0.99, max: 1.0, perclo: 5.0, perchi: 95.0}
  costnorm: {impl: perc_ema, decay: 0.99, max: 1.0, perclo: 5.0, perchi: 95.0}
  planner: {horizon: 15, num_samples: 500, mixture_coef: 0.05, num_elites: 50, temperature: 10.0, iterations: 6, momentum: 0.1, init_std: 1.0}

  pid: {kp: 0.0, ki: 0.1, kd: 0.0, init_penalty: 0.0, d_delay: 10, delta_p_ema_alpha: 0.95, delta_d_ema_alpha: 0.95, sum_norm: True, diff_norm: False, penalty_max: 100.0, lagrangian_multiplier_init: 0.001,  use_cost_decay: False, init_cost_limit: 10.0, decay_time_step: 20000, decay_num: 7, decay_limit_step: 2.0}
  actent: 3e-4

  # Exploration
  expl_rewards: {extr: 1.0, disag: 0.1}
  expl_opt: {opt: adam, lr: 1e-4, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0}
  disag_head: {layers: 5, units: 1024, act: silu, norm: layer, dist: mse, outscale: 1.0, inputs: [deter, stoch, action], winit: normal, fan: avg}
  disag_target: [stoch]
  disag_models: 8


  dual:
    pf: 0.2
    init_log_cg: -2.0
    init_lam1: 1.0
    init_lam2: 1.0
    init_lam3: 0.5
    init_lam4: 0.5
    target_kl: 5.0
    lam_lr: 1e-4
    lam_max: 10.0
    cost_gamma: 0.98
    target_tau: 0.02
    enable_thresh: 0.75   #对偶策略介入的阈值 95%安全样本时介入
    enable_decay: 0.90    #计算可行性的平滑系数
    cost_threshold: 0.2
    is_min_weight: 0.1
    is_max_weight: 5.0
    min_cg: 0.005
    max_cg: 0.05
    boundary_mode: band
    boundary_sigma: 0.05
    dual_mix_ratio: 0.5
    probe_ratio: 0.5
    probe_blend: 0.2
    min_real_steps: 0
    actor_cross_mix_ratio: 0.3
    is_beta: 0.3
    is_step_log_clip: 2.0
