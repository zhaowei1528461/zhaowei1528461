# World-Engine-inspired structured-data post-training:
# failures are mined online from collision / near-miss / low-progress episodes,
# then replayed as scenario-copy or intent-attack traffic variants.
osrp_sumo_lag_vector_danger:
  task_behavior: Greedy  # 主任务策略类型
  expl_behavior: None  # 探索策略类型；None表示不额外使用探索行为
  use_cost: True  # 是否启用安全cost训练信号
  cost_weight: 10  # cost损失/惩罚权重
  cost_limit: 0.5  # PID Lagrangian的目标cost上限
  task: sumo_None  # 使用SUMO环境
  envs.amount: 2  # 并行SUMO worker数量；会生成worker_0/worker_1日志分片
  replay: danger  # 使用带危险序列重采样的replay buffer
  danger_replay: {sample_ratio: 0.6, cost_threshold: 0.20}  # 第二轮训练中危险序列采样比例和cost判定阈值
  danger_posttrain:
    enabled: True  # 启用“两阶段训练”：先bootstrap，再危险场景post-train
    bootstrap_episodes: 5000  # 测试回放：第一轮10个episode后开始全场景危险评估
    evaluate_all_scenarios: True  # 是否在第二轮前评估所有sumocfg场景
    freeze_danger_library_after_sweep: True  # 仅冻结旧危险库更新/旧事件日志；独立episode采集仍可启用
    reference_kl_target: 1.0  # 第二轮策略和冻结参考策略之间的KL目标
    reference_kl_lam_init: 1.0  # KL约束拉格朗日系数初始值
    reference_kl_lam_lr: 1e-4  # KL约束系数更新学习率
    reference_kl_lam_max: 20.0  # KL约束系数上限
  env:
    sumo:
      repeat: 1
      render: False
      obs_key: observation
      danger:
        enabled: True  # 启用SUMO危险场景挖掘/生成器
        generation_enabled: True  # 允许第二轮从危险库生成scenario_copy或intent_attack变体
        collect_episodes: False  # 独立轨迹池默认关闭；sumo_long_tail_data overlay显式启用
        update_library: True  # 是否在线更新旧危险库；冻结后训练会覆盖为False
        warmup_episodes: 20  # 危险库准备阈值；导入sweep结果后通常会直接满足
        library_size: 200  # 保留最高severity的危险原型数量
        generate_probability: 1.0  # 第二轮每次reset都尝试从危险库生成训练场景
        generation_mode: mixed  # copy/attack/replay/mixed/off：控制第二轮危险场景生成类型
        replay_probability: 0.333333  # 三类危险训练之一：直接回放背景车
        intent_attack_probability: 0.50  # 非回放危险变体中选择intent_attack；因此copy和attack各约1/3
        near_miss_ttc: 2.5  # TTC低于该值的episode记为near_miss
        risk_cost_threshold: 0.20  # max_cost高于该值的episode记为high_risk_cost
        min_initial_distance: 5.0  # 生成变体前最近车辆的最小安全距离
        copy_speed_jitter: 1.0  # 兼容旧配置；当前scenario_copy不再做速度扰动
        attack_speed_delta: 2.0  # intent_attack速度增量上限
        max_target_speed: 8.0  # 变体中目标车速度上限
        intent_attack_wait_steps: 30  # intent_attack初始无背景车时，最多等待多少个SUMO步让cfg车流出现
        intent_attack_replay_bootstrap: False  # intent_attack初始无背景车时不走replay兜底，只重试下一个危险样本
        intent_attack_bootstrap_frames: 8  # intent_attack最多尝试多少个replay帧来恢复背景车
        max_replay_steps: 400  # 每个危险原型最多保存多少步回放轨迹
        replay_pre_margin: 3  # 生成变体时从关键危险帧前多少步恢复
        max_replay_seek_steps: 400  # 恢复回放轨迹时最多快进多少个SUMO step
        replay_frame_search: 8  # 关键帧附近额外尝试的回放帧数量
        replay_insert_missing: True  # 回放恢复时尝试补回当前SUMO中不存在的车辆
        replay_insert_during_playback: False  # 回放开始后不再补插新车，避免TraCI连接被SUMO关闭
        replay_ego: False  # 回放时只回放旁车；Auto自车仍由当前策略从起点正常控制
        require_valid_replay_state: False  # 测试回放：回放恢复后不因近距离/碰撞 gate 直接回退
        fallback_to_normal_on_danger_failure: False  # 危险变体失败时不回退普通场景，改为重试或报错
        max_danger_generation_attempts: 8  # 单次reset最多重试多少个危险原型
        highlight_danger_target: True  # 第二轮生成intent_attack时高亮被扰动背景车
        danger_target_color: [255, 255, 0, 255]  # 被扰动背景车颜色，默认黄色RGBA
        highlight_replay_vehicles: True  # 第二轮replay时高亮回放背景车
        replay_vehicle_color: [0, 0, 255, 255]  # 回放背景车颜色，默认蓝色RGBA
        replay_progress_interval: 0  # 回放推进时每隔多少帧打印一次进度；0表示关闭
        replay_debug_interval: 0  # 回放诊断：每隔多少帧打印细节；0表示关闭
        max_episode_steps: 2500  # 兜底：单个episode最多允许的环境step数；0表示关闭
        seed: 0  # 危险场景采样随机种子
  loss_scales: {vector: 5.0}  # SUMO向量观测重建损失权重
  run.train_ratio: 512  # 每收集环境步对应的训练更新强度
  pid: {kp: 0.1, ki: 0.01, kd: 0.01, init_penalty: 0.0, penalty_max: 0.5, init_cost_limit: 0.9, use_cost_decay: True}  # cost约束PID Lagrangian参数
  run:
    script: train_eval  # 使用训练+评估循环，包含bootstrap sweep和post-train逻辑
    steps: 5e6  # 总环境步预算
    eval_every: 1e4  # 常规评估间隔，单位是环境step
    eval_initial: False  # 启动时是否立即做一次常规评估
    eval_eps: 1  # 常规评估episode数量
  rssm.deter: 512  # RSSM确定性隐状态维度
  .*\.cnn_depth: 32  # CNN通道宽度；SUMO向量任务基本不使用CNN
  .*\.layers: 2  # 主要MLP/Head层数覆盖
  .*\.units: 64  # 主要MLP/Head隐藏单元数覆盖
  .*\.mlp_units: 64  # encoder/decoder MLP隐藏单元数
  .*\.mlp_layers: 3  # encoder/decoder MLP层数
  rssm: {stoch: 16, classes: 4}  # RSSM离散随机状态大小
  encoder: {mlp_keys: 'state', cnn_keys: '$^'}  # 只编码state向量，不使用图像CNN
  decoder: {mlp_keys: 'state', cnn_keys: '$^'}  # 只重建state向量，不重建图像

# Enable alongside osrp_sumo_lag_vector_danger to collect independent episodes.
sumo_long_tail_data:
  env.sumo.danger.collect_episodes: True
